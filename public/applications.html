<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Applications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --fg: #09090b;
      --muted: #71717a;
      --muted-bg: #f4f4f5;
      --border: #e4e4e7;
      --input-bg: #ffffff;
      --ring: #18181b;
      --card-bg: #ffffff;
      --card-shadow: 0 1px 3px 0 rgb(0 0 0 / .1), 0 1px 2px -1px rgb(0 0 0 / .1);
      --radius: 0.5rem;
      --btn-bg: #18181b;
      --btn-fg: #fafafa;
      --btn-hover: #27272a;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --danger-fg: #dc2626;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --muted-bg: #27272a;
        --border: #27272a;
        --input-bg: #09090b;
        --ring: #d4d4d8;
        --card-bg: #18181b;
        --card-shadow: 0 1px 3px 0 rgb(0 0 0 / .4), 0 1px 2px -1px rgb(0 0 0 / .4);
        --btn-bg: #fafafa;
        --btn-fg: #18181b;
        --btn-hover: #e4e4e7;
        --danger-bg: #450a0a;
        --danger-border: #7f1d1d;
        --danger-fg: #fca5a5;
      }
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      min-height: 100dvh;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      height: 2.25rem;
      padding: 0 1rem;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--btn-fg);
      background: var(--btn-bg);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }

    .btn:hover { background: var(--btn-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg);
    }

    .btn-outline:hover {
      background: var(--muted-bg);
    }

    .btn-danger {
      background: transparent;
      border: 1px solid var(--danger-border);
      color: var(--danger-fg);
    }

    .btn-danger:hover {
      background: var(--danger-bg);
    }

    .empty {
      text-align: center;
      padding: 4rem 2rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px);
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      background: var(--muted-bg);
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .empty-icon svg { color: var(--muted); }

    .empty h2 {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .empty p {
      color: var(--muted);
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }

    .app-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px);
      padding: 1.25rem;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }

    .app-info { flex: 1; min-width: 0; }

    .app-name {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .app-url {
      font-size: 0.8125rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
      word-break: break-all;
    }

    .app-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .app-meta-item {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--muted-bg);
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
    }

    .app-meta-item code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.6875rem;
    }

    .app-actions {
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .error-msg {
      display: none;
      font-size: 0.8125rem;
      color: var(--danger-fg);
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
    }

    .login-prompt {
      text-align: center;
      padding: 4rem 2rem;
    }

    .login-prompt p {
      color: var(--muted);
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="errorMsg" class="error-msg" role="alert"></div>

    <div class="header">
      <h1>My Applications</h1>
      <a href="/application-form.html" class="btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        New Application
      </a>
    </div>

    <div id="content"></div>
  </div>

  <script>
    const content = document.getElementById('content');
    const errorMsg = document.getElementById('errorMsg');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }

    function getToken() {
      const stored = localStorage.getItem('token');
      if (stored) return stored;
      const params = new URLSearchParams(window.location.search);
      return params.get('token');
    }

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
    }

    async function loadApplications() {
      const token = getToken();

      if (!token) {
        content.innerHTML = `
          <div class="login-prompt">
            <p>Sign in to manage your OAuth applications</p>
            <a href="/o/authenticate" class="btn">Sign In</a>
          </div>
        `;
        return;
      }

      try {
        const res = await fetch('/applications', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.status === 401) {
          localStorage.removeItem('token');
          content.innerHTML = `
            <div class="login-prompt">
              <p>Your session has expired. Please sign in again.</p>
              <a href="/o/authenticate" class="btn">Sign In</a>
            </div>
          `;
          return;
        }

        if (!res.ok) {
          throw new Error('Failed to load applications');
        }

        const applications = await res.json();
        renderApplications(applications);
      } catch (err) {
        showError(err.message || 'Failed to load applications');
      }
    }

    function renderApplications(applications) {
      if (applications.length === 0) {
        content.innerHTML = `
          <div class="empty">
            <div class="empty-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="3" y1="9" x2="21" y2="9"></line>
                <line x1="9" y1="21" x2="9" y2="9"></line>
              </svg>
            </div>
            <h2>No applications yet</h2>
            <p>Create your first OAuth application to get started</p>
            <a href="/application-form.html" class="btn">Create Application</a>
          </div>
        `;
        return;
      }

      content.innerHTML = `
        <div class="app-list">
          ${applications.map(app => `
            <div class="app-card">
              <div class="app-info">
                <div class="app-name">${escapeHtml(app.displayName)}</div>
                <div class="app-url">${escapeHtml(app.applicationUrl)}</div>
                <div class="app-meta">
                  <div class="app-meta-item">
                    Client ID: <code>${escapeHtml(app.clientId)}</code>
                  </div>
                  <div class="app-meta-item">
                    Callback: ${escapeHtml(app.redirectUrl)}
                  </div>
                  <div class="app-meta-item">
                    Created: ${formatDate(app.createdAt)}
                  </div>
                </div>
              </div>
              <div class="app-actions">
                <a href="/application-form.html?clientId=${encodeURIComponent(app.clientId)}" class="btn btn-outline">Edit</a>
                <button class="btn btn-danger" onclick="deleteApp('${app.clientId}')">Delete</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    async function deleteApp(clientId) {
      if (!confirm('Are you sure you want to delete this application? This action cannot be undone.')) {
        return;
      }

      const token = getToken();
      if (!token) return;

      try {
        const res = await fetch(`/applications/${clientId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) {
          throw new Error('Failed to delete application');
        }

        loadApplications();
      } catch (err) {
        showError(err.message);
      }
    }

    window.deleteApp = deleteApp;
    loadApplications();
  </script>
</body>
</html>
